<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/styles.css" rel="stylesheet">
    <title>IronMaker</title>

</head>
<body>
    <header class="fixed top-0 left-0 z-50 w-full">
        <nav class="bg-slate-950/95 mx-auto flex items-center justify-between px-6 py-4 ">
            <a href="#inicio" class="flex items-center gap-2">
                <span class="text-white font-bold text-xl">Iron<span class="text-cyan-400">Maker</span></span>
            </a>

            <div class="hidden items-center gap-8 md:flex">
                <a href="#inicio" class="text-sm font-medium text-white transition hover:text-cyan-400">Início</a>
                <a href="#sobre" class="text-sm font-medium text-white transition hover:text-cyan-400">Sobre</a>
                <a href="#funcionalidades" class="text-sm font-medium text-white transition hover:text-cyan-400">Funcionalidades</a>
                <a href="#tecnologias" class="text-sm font-medium text-white transition hover:text-cyan-400">Tecnologias</a>
                <a href="#painel" class="rounded-lg bg-cyan-500 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400 hover:shadow-lg hover:shadow-cyan-500/20">Acessar Painel</a>
            </div>

            <!-- Botão Mobile -->
        </nav>
    </header>

    <main>
        <!-- hero -->
        <section id="inicio" class="bg-cyan-950 text-white px-6 pt-[76px]">
            <div class="mx-auto grid max-w-7xl items-center gap-12 md:grid-cols-2 py-20">
                <div class="flex flex-col justify-center">
                    <h1 class="text-2xl font-semibold uppercase tracking-widest text-cyan-400 ">Casa Inteligente</h1>
                    <h4 class="mt-4 text-4xl font-bold text-wrap">Sua casa, mais inteligente e conectada.</h4>
                    <p class="mt-6 max-w-xl text-lg">Monitore sensores e controle dispositivos da sua casa através de uma única interface web.</p>
                    <div class="mt-8 flex flex-wrap gap-4">
                        <a class="rounded-lg bg-cyan-500 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400 hover:shadow-lg hover:shadow-cyan-500/20" href="#solucao">Conheça o projeto</a>
                    </div>
                </div>
                    <div class="w-full flex justify-center text-center">
                        <img src="/img/casaAutomatizada.png" alt="" class="size-100 text-center ">
                    </div>
            </div>
        </section>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
